name: 'Check for Changes'

description: 'Check for relevant changes in tests, config, and dependencies'

inputs:
  event-name:
    description: 'GitHub event name'
    required: true

  base-ref:
    description: 'Base reference for pull request'
    required: false
    default: ''

outputs:
  should-run:
    description: 'Whether workflow should run (true/false)'
    value: ${{ steps.check.outputs.should-run }}

runs:
  using: 'composite'

  steps:
    - name: 🔍 Check for relevant changes
      id: check
      shell: bash
      run: |
        if [[ "${{ inputs.event-name }}" == "pull_request" && "${{ inputs.base-ref }}" == "main" ]]; then
          echo "should-run=true" >> "$GITHUB_OUTPUT"
          echo "Reason: Pull request to main"

        elif [[ "${{ inputs.event-name }}" == "workflow_dispatch" ]]; then
          echo "should-run=true" >> "$GITHUB_OUTPUT"
          echo "Reason: Manual trigger (workflow_dispatch)"

        else
          echo "Checking for changes in: tests/, playwright.config.ts, package.json"

          if git diff origin/main..HEAD --quiet -- tests/ playwright.config.ts package.json; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "Reason: No changes in relevant paths - skipping tests"
          else
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "Reason: Changes detected in relevant paths"
          fi
        fi

    - name: 📊 Display check result
      shell: bash
      run: |
        echo "Should run tests: ${{ steps.check.outputs.should-run }}"
        echo "Event: ${{ inputs.event-name }}"
        echo "Base ref: ${{ inputs.base-ref }}"