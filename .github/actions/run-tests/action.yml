name: 'Run Tests'
description: 'Run Playwright tests in headless mode'

inputs:
  debug:
    description: 'Run in debug mode'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: 🎭 Run Playwright Tests (headless)
      if: inputs.debug == 'false'
      run: npx playwright test
      shell: bash

    - name: 🎭 Run Playwright Tests (debug mode - headless)
      if: inputs.debug == 'true'
      run: npx playwright test --debug
      shell: bash

    - name: Display test execution info
      run: |
        echo "Tests executed in headless mode"
        echo "Debug: ${{ inputs.debug }}"
      shell: bash